name: licasa
title: Licasa
version: '0.9.5'
summary: Fast, image-first photo viewer and editor
description: |
  Licasa opens photographs in a focused, image-sized window. Browse, zoom,
  compare, edit and export images, including modern formats such as HEIF,
  AVIF, JPEG XL and camera RAW. Motion Photo playback is included.
contact: https://github.com/sanxchep/licasa/issues
source-code: https://github.com/sanxchep/licasa
issues: https://github.com/sanxchep/licasa/issues
license: BSD-2-Clause
icon: assets/licasa.png
base: core24
grade: stable
confinement: strict

# Licasa's private Qt and codec runtimes are required by the viewer and its
# plugins, but Snapcraft's library scan cannot resolve all of those paths.
lint:
  ignore:
    - library:
        - usr/lib/licasa/lib/libQt6Quick.so.*
        - usr/lib/licasa/lib/libdav1d.so.*
        - usr/lib/licasa/lib/libde265.so.*
        - usr/lib/licasa/lib/libheif.so.*

# The qualified private Qt patches and codec builds currently target only
# Ubuntu 24.04 on amd64. Add platforms after qualifying their runtime stacks.
platforms:
  amd64:

apps:
  licasa:
    command: usr/bin/licasa
    desktop: usr/share/applications/licasa.desktop
    autostart: licasa-background.desktop
    extensions: [gnome]
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/licasa/lib:$SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
      QT_PLUGIN_PATH: $SNAP/usr/lib/licasa/plugins:$SNAP/usr/lib/x86_64-linux-gnu/qt6/plugins
      QML2_IMPORT_PATH: $SNAP/usr/lib/x86_64-linux-gnu/qt6/qml
      QML_IMPORT_PATH: $SNAP/usr/lib/x86_64-linux-gnu/qt6/qml
      QT_QPA_PLATFORM_PLUGIN_PATH: $SNAP/usr/lib/x86_64-linux-gnu/qt6/plugins/platforms
    plugs:
      - home
      - removable-media
      - audio-playback

parts:
  licasa:
    plugin: nil
    # GitHub Actions builds this Snap from its checkout. Keep the Debian payload
    # self-contained so the Snap uses the same qualified build recipe.
    source: .
    build-packages:
      - ca-certificates
      - cmake
      - ninja-build
      - g++
      - python3
      - pkg-config
      - patch
      - git
      - meson
      - nasm
      - dpkg-dev
      - binutils
      - qt6-base-dev
      - qt6-declarative-dev
      - qt6-svg-dev
      - qt6-image-formats-plugins
      - libopenjp2-7-dev
      - libjpeg-turbo8-dev
      - libtiff-dev
      - libpng-dev
      - libwebp-dev
      - libxext-dev
      - libegl-dev
      - libdrm-dev
      - libva-dev
      - qt6-base-private-dev
      - qt6-declarative-private-dev
      - qt6-shadertools-dev
      - qt6-multimedia-dev
      - libpulse-dev
      - libavcodec-dev
      - libavformat-dev
      - libavutil-dev
      - libswresample-dev
      - libswscale-dev
      - libavdevice-dev
      - libavfilter-dev
      - qml6-module-qtquick
      - qml6-module-qtquick-window
      - qml6-module-qtqml-workerscript
      - qml6-module-qtqml-models
      - qml6-module-qtqml
      - qml6-module-qttest
      - qml6-module-qtquick-controls
      - qml6-module-qtquick-templates
      - qml6-module-qtquick-dialogs
      - qml6-module-qtquick-layouts
      - qml6-module-qt-labs-folderlistmodel
    stage-packages:
      - libavcodec60
      - libavformat60
      - libavutil58
      - libgomp1
      - libjpeg8
      - libopenjp2-7
      - libqt6core6t64
      - libqt6gui6t64
      - libqt6multimedia6
      - libqt6network6t64
      - libqt6opengl6t64
      - libqt6qml6
      - libqt6qmlmodels6
      - libqt6quick6
      - libqt6quickdialogs2-6
      - libqt6svg6
      - libswresample4
      - libswscale7
      - libtiff6
      - libwebp7
      - libwebpdemux2
      - libwebpmux3
      - libx11-6
      - libxext6
      - qt6-image-formats-plugins
      - qt6-wayland
      - qml6-module-qtqml
      - qml6-module-qtqml-workerscript
      - qml6-module-qtqml-models
      - qml6-module-qtquick
      - qml6-module-qtquick-controls
      - qml6-module-qtquick-dialogs
      - qml6-module-qtquick-layouts
      - qml6-module-qtquick-templates
      - qml6-module-qtquick-window
      - qml6-module-qt-labs-folderlistmodel
    override-build: |
      set -eu
      cd "$CRAFT_PART_BUILD"
      source_commit="$(git -C "$CRAFT_PROJECT_DIR" rev-parse HEAD)"
      if [ -n "$(git -C "$CRAFT_PROJECT_DIR" status --porcelain)" ]; then
        source_commit="${source_commit}-dirty"
      fi
      deb_name="licasa_${SNAPCRAFT_PROJECT_VERSION}-1_amd64.deb"
      if [ -d "$CRAFT_PROJECT_DIR/snap-input" ]; then
        # Release CI supplies only the already tested Debian artifact from this
        # same workflow run. A mismatched receipt fails; it never falls back.
        input="$CRAFT_PROJECT_DIR/snap-input"
        test "$(cat "$input/source-commit.txt")" = "$source_commit"
        case "$source_commit" in *-dirty) exit 1 ;; esac
        deb="$input/$deb_name"
        (cd "$input" && sha256sum --check "$deb_name.sha256")
      else
        # Standalone Snapcraft builds retain the full qualified source recipe.
        python3 tools/build_ubuntu_deb.py --jobs 4
        deb="build/qualification/deb/$deb_name"
        (cd build/qualification/deb && sha256sum --check "$deb_name.sha256")
      fi
      test "$(dpkg-deb --field "$deb" Version)" = "${SNAPCRAFT_PROJECT_VERSION}-1"
      test "$(dpkg-deb --field "$deb" Architecture)" = amd64
      dpkg-deb -x "$deb" "$CRAFT_PART_INSTALL"
      # Native transaction launchers/gates belong to dpkg, not snapd. Snap
      # confinement and revision lifecycle wrap the actual viewer directly.
      if [ -f "$CRAFT_PART_INSTALL/usr/bin/licasa.bin" ]; then
        mv -f "$CRAFT_PART_INSTALL/usr/bin/licasa.bin" "$CRAFT_PART_INSTALL/usr/bin/licasa"
        rm -f "$CRAFT_PART_INSTALL/usr/share/licasa/native-runtime.json" \
          "$CRAFT_PART_INSTALL/usr/lib/licasa/native_lifecycle.py"
      fi
      test -x "$CRAFT_PART_INSTALL/usr/bin/licasa"
      readelf -d "$CRAFT_PART_INSTALL/usr/bin/licasa" | grep -Fq 'libXext.so.6'
      install -d "$CRAFT_PART_INSTALL/usr/share/licasa"
      printf '%s\n' "$source_commit" > "$CRAFT_PART_INSTALL/usr/share/licasa/source-commit"
    override-prime: |
      set -eu
      craftctl default
      # Check the final merged payload, including stage-packages, rather than
      # relying on the GNOME content snap to supply this exact Qt profile.
      python3 "$CRAFT_PROJECT_DIR/tools/qt_runtime.py" \
        --qml-root "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/qml" \
        --library-root "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR" \
        --qt-version 6.4.2 \
        --output "$CRAFT_PRIME/usr/share/licasa/qt-runtime-inventory.json"
