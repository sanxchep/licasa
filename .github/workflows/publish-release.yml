name: Approve stable and mark GitHub release latest

on:
  workflow_dispatch:
    inputs:
      approve_stable:
        description: Explicitly authorize stable/latest publication of this exact qualified candidate
        required: true
        type: boolean
        default: false
      build_run_id:
        description: Successful build run that published the GitHub prerelease
        required: true
        type: string
      qualification_run_id:
        description: Successful exact-candidate qualification run for these source and package hashes
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: licasa-release
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      source_sha: ${{ steps.build.outputs.source_sha }}
      build_attempt: ${{ steps.build.outputs.build_attempt }}
    steps:
      - name: Require explicit stable publication intent
        env:
          APPROVED: ${{ inputs.approve_stable }}
        run: test "$APPROVED" = true
      - name: Check the selected build run succeeded
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$QUALIFICATION_RUN_ID" =~ ^[0-9]+$ ]]
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gh
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" \
            > "$RUNNER_TEMP/licasa-build-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" \
            > "$RUNNER_TEMP/licasa-qualification-run.json"
          python3 - "$RUNNER_TEMP/licasa-build-run.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as build_file:
              build = json.load(build_file)
          path = build["path"].split("@", 1)[0]
          if (path != ".github/workflows/snapcraft-build.yml"
                  or build["head_branch"] != "main"
                  or build["conclusion"] != "success"):
              raise SystemExit("Select a successful Licasa main build run")
          with open(os.environ['RUNNER_TEMP'] + '/licasa-qualification-run.json', encoding='utf-8') as stream:
              qualification = json.load(stream)
          if (qualification['path'].split('@', 1)[0] != '.github/workflows/qualify-candidate.yml'
                  or qualification['conclusion'] != 'success'
                  or qualification['head_sha'] != build['head_sha']
                  or qualification['repository']['full_name'] != os.environ['GITHUB_REPOSITORY']):
              raise SystemExit('Require successful exact-candidate qualification from this repository and source SHA')
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"source_sha={build['head_sha']}\n")
              output.write(f"build_attempt={build['run_attempt']}\n")
          print(f"Verified build run {build['id']} for {build['head_sha']}")
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.build.outputs.source_sha }}
          fetch-depth: 0
      - name: Check version, tag, and release notes
        id: version
        env:
          SOURCE_SHA: ${{ steps.build.outputs.source_sha }}
        run: |
          version="$(sed -n "s/^version: '\([0-9.]*\)'$/\1/p" snap/snapcraft.yaml)"
          test -n "$version"
          python3 tools/check_release_version.py \
            --channel stable --expected-sha "$SOURCE_SHA" \
            --source-ref "refs/tags/v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Require a published GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/licasa-prerelease.json"
          python3 - "$RUNNER_TEMP/licasa-prerelease.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as release_file:
              release = json.load(release_file)
          if release["draft"] or not release["prerelease"]:
              raise SystemExit("Selected build must have a published GitHub prerelease")
          PY

  verify_artifacts:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      revision: ${{ steps.edge.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: licasa-linux-amd64
          path: dist
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: licasa-snap-amd64
          path: dist/snap
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: licasa-debian13-amd64
          path: dist/debian13
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: licasa-candidate-qualification
          path: evidence
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}
      - name: Require complete qualification of these exact candidate files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          python3 tools/check_support_manifest.py
          mkdir -p published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published \
            --pattern '*.deb' --pattern '*.AppImage' --pattern '*.rpm' \
            --pattern '*.pkg.tar.zst' --pattern '*.snap' --pattern 'PKGBUILD*' \
            --pattern 'native_lifecycle.py' --pattern 'licasa.install' --pattern 'licasa-lifecycle.hook'
          (cd published && sha256sum --check PKGBUILD.sha256 && sha256sum --check PKGBUILD.sources.sha256)
          python3 tools/qualification_evidence.py check --source-sha "$SOURCE_SHA" \
            --build-run-id "$BUILD_RUN_ID" --version "$VERSION" --packages dist --evidence evidence \
            --published published --release-notes "packaging/release-notes/${RELEASE_TAG}.md"
      - name: Check package hashes and embedded source commit
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools
          (cd dist/deb && sha256sum --check "licasa_${VERSION}-1_amd64.deb.sha256")
          test "$(dpkg-deb --field "dist/deb/licasa_${VERSION}-1_amd64.deb" Version)" = "${VERSION}-1"
          (cd dist/appimage && sha256sum --check "Licasa-${VERSION}-x86_64.AppImage.sha256")
          (cd dist/appimage && sha256sum --check install-licasa-appimage.sh.sha256)
          (cd dist/rpm && sha256sum --check "licasa-appimage-${VERSION}-1.fc44.x86_64.rpm.sha256")
          (cd dist/arch && sha256sum --check "licasa-appimage-${VERSION}-1-x86_64.pkg.tar.zst.sha256")
          (cd dist/arch && sha256sum --check PKGBUILD.sha256)
          (cd dist/arch && sha256sum --check PKGBUILD.sources.sha256)
          (cd dist/snap && sha256sum --check "licasa_${VERSION}_amd64.snap.sha256")
          source_commit="$(unsquashfs -cat "dist/snap/licasa_${VERSION}_amd64.snap" \
            usr/share/licasa/source-commit)"
          test "$source_commit" = "$SOURCE_SHA"
      - uses: actions/download-artifact@v8
        with:
          name: licasa-full-verification
          path: full-verification
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Require original FULL source and platform verification
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_ATTEMPT: ${{ needs.preflight.outputs.build_attempt }}
        run: |
          python3 tools/ci_receipt.py check --receipt full-verification/verification-result.json \
            --source-sha "$SOURCE_SHA" --version "$VERSION" --run-id "$BUILD_RUN_ID" --attempt "$BUILD_ATTEMPT"
          python3 tools/qualification_evidence.py check --source-sha "$SOURCE_SHA" \
            --build-run-id "$BUILD_RUN_ID" --version "$VERSION" --packages dist --evidence full-verification
      - name: Verify edge still points to this Snap
        id: edge
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          sudo snap set system experimental.user-daemons=false
          sudo snap install --channel=edge licasa
          python3 tools/verify_snap_install.py --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --output build/qualification/snap-edge-publish-smoke.json
          revision="$(snap list licasa | awk 'NR == 2 {print $3}')"
          test "$revision" -gt 0
          expected="$(cut -d' ' -f1 "dist/snap/licasa_${VERSION}_amd64.snap.sha256")"
          actual="$(sudo sha256sum "/var/lib/snapd/snaps/licasa_${revision}.snap" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  publish_snap:
    needs: [preflight, verify_artifacts]
    runs-on: ubuntu-24.04
    # Retain the existing credential and approval environment.
    environment: snap-beta
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - name: Require Store credentials
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: test -n "$SNAPCRAFT_STORE_CREDENTIALS"
      - name: Promote the checked revision to stable
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          REVISION: ${{ needs.verify_artifacts.outputs.revision }}
        run: |
          sudo snap install snapcraft --classic
          snapcraft release licasa "$REVISION" stable
      - name: Install and verify stable
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          REVISION: ${{ needs.verify_artifacts.outputs.revision }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          sudo snap set system experimental.user-daemons=false
          sudo snap install --channel=stable licasa
          for ((attempt = 1; attempt <= 10; attempt++)); do
            if [ "$(snap list licasa | awk 'NR == 2 {print $3}')" = "$REVISION" ]; then
              break
            fi
            sleep 20
            sudo snap refresh --channel=stable licasa
          done
          test "$(snap list licasa | awk 'NR == 2 {print $3}')" = "$REVISION"
          python3 tools/verify_snap_install.py --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --output build/qualification/snap-stable-smoke.json
      - uses: actions/upload-artifact@v7
        with:
          name: licasa-stable-snap-smoke
          path: build/qualification/snap-stable-smoke.json
          if-no-files-found: error
          retention-days: 7

  finalize_github_release:
    needs: [preflight, verify_artifacts, publish_snap]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: snap-beta
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: licasa-linux-amd64
          path: dist
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: licasa-snap-amd64
          path: dist/snap
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: licasa-debian13-amd64
          path: dist/debian13
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: licasa-candidate-qualification
          path: evidence
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}
      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gh
      - name: Recheck retained qualification and published assets before final promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          mkdir -p published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published \
            --pattern '*.deb' --pattern '*.AppImage' --pattern '*.rpm' \
            --pattern '*.pkg.tar.zst' --pattern '*.snap' --pattern 'PKGBUILD*' \
            --pattern 'native_lifecycle.py' --pattern 'licasa.install' --pattern 'licasa-lifecycle.hook'
          (cd published && sha256sum --check PKGBUILD.sha256 && sha256sum --check PKGBUILD.sources.sha256)
          python3 tools/qualification_evidence.py check --source-sha "$SOURCE_SHA" \
            --build-run-id "$BUILD_RUN_ID" --version "$VERSION" --packages dist --evidence evidence \
            --published published --release-notes "packaging/release-notes/${RELEASE_TAG}.md"
      - name: Recheck source, versions, and checksums
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          python3 tools/check_release_version.py \
            --channel stable --expected-sha "$SOURCE_SHA" \
            --source-ref "refs/tags/v$VERSION"
          (cd dist/debian13 && sha256sum --check "licasa_${VERSION}-1+deb13_amd64.deb.sha256")
          (cd dist/deb && sha256sum --check "licasa_${VERSION}-1_amd64.deb.sha256")
          (cd dist/appimage && sha256sum --check "Licasa-${VERSION}-x86_64.AppImage.sha256")
          (cd dist/appimage && sha256sum --check install-licasa-appimage.sh.sha256)
          (cd dist/rpm && sha256sum --check "licasa-appimage-${VERSION}-1.fc44.x86_64.rpm.sha256")
          (cd dist/arch && sha256sum --check "licasa-appimage-${VERSION}-1-x86_64.pkg.tar.zst.sha256")
          (cd dist/arch && sha256sum --check PKGBUILD.sha256)
          (cd dist/arch && sha256sum --check PKGBUILD.sources.sha256)
          (cd dist/snap && sha256sum --check "licasa_${VERSION}_amd64.snap.sha256")
      - name: Mark the checked GitHub prerelease as Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SNAP_REVISION: ${{ needs.verify_artifacts.outputs.revision }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          {
            printf 'Stable release: all required package qualifications passed for this source and these checksums.\n\n'
            cat "packaging/release-notes/$RELEASE_TAG.md"
            printf "\n### Package SHA-256 checksums\n\n\`\`\`text\n"
            cat "dist/debian13/licasa_${VERSION}-1+deb13_amd64.deb.sha256"
            cat "dist/deb/licasa_${VERSION}-1_amd64.deb.sha256"
            cat "dist/appimage/Licasa-${VERSION}-x86_64.AppImage.sha256"
            cat "dist/appimage/install-licasa-appimage.sh.sha256"
            cat "dist/rpm/licasa-appimage-${VERSION}-1.fc44.x86_64.rpm.sha256"
            cat "dist/arch/licasa-appimage-${VERSION}-1-x86_64.pkg.tar.zst.sha256"
            cat "dist/arch/PKGBUILD.sha256"
            cat "dist/arch/PKGBUILD.sources.sha256"
            cat "dist/snap/licasa_${VERSION}_amd64.snap.sha256"
            printf "\`\`\`\n"
            printf "\nPackage qualification: https://github.com/%s/actions/runs/%s.\n" "$GITHUB_REPOSITORY" "$QUALIFICATION_RUN_ID"
            printf "\nSnap stable revision: %s.\n" "$SNAP_REVISION"
            printf "Source commit: \`%s\`.\n" "$SOURCE_SHA"
          } > dist/release-notes.md
          tar -czf "dist/qualification-${VERSION}-${SOURCE_SHA}.tar.gz" -C evidence .
          gh release upload "$RELEASE_TAG" "dist/qualification-${VERSION}-${SOURCE_SHA}.tar.gz" --clobber
          gh release edit "$RELEASE_TAG" --prerelease=false --latest \
            --notes-file dist/release-notes.md
