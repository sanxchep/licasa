name: Retry failed platform verification

on:
  workflow_call:
    inputs:
      build_run_id:
        description: Completed verification run whose packages and passed checks are reused
        required: true
        type: string

      expected_sha:
        description: Exact reviewed verifier commit at the selected dispatch ref
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      desktops: ${{ steps.plan.outputs.desktops }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate reusable builds and select only failed platform checks
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$RUNNER_ENVIRONMENT" = github-hosted
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name verification-plan --dir "$RUNNER_TEMP/original-plan"
          python3 tools/retry_ci_verification.py plan --plan "$RUNNER_TEMP/original-plan/verification-plan.json" --run "$RUNNER_TEMP/run.json" \
            --jobs "$RUNNER_TEMP/jobs.json" --artifacts "$RUNNER_TEMP/artifacts.json" --github-output "$GITHUB_OUTPUT"

  packages:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: build/candidate-packages
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Retry the failed package contract on the identical candidate
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          TARGET: ${{ matrix.target }}
        run: |
          python3 tools/qualification_evidence.py run-target --source-sha "$SOURCE_SHA" --verification-sha "$GITHUB_SHA" \
            --build-run-id "$BUILD_RUN_ID" --version "$VERSION" \
            --packages build/candidate-packages --evidence build/candidate-reports --target "$TARGET"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retry-outcome-${{ matrix.target }}
          path: build/candidate-reports/
          retention-days: 90
          if-no-files-found: error

  snap_desktops:
    needs: plan
    if: ${{ needs.plan.outputs.desktops != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(needs.plan.outputs.desktops) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: verification-snap
          path: build/candidate-packages/snap
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Install the identical candidate and complete disposable desktop
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          DESKTOP: ${{ matrix.desktop }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil xvfb dbus-x11 \
            libglib2.0-bin x11-utils xdotool imagemagick mesa-utils libgl1-mesa-dri fonts-dejavu-core
          case "$DESKTOP" in
            gnome) sudo apt-get install -y --no-install-recommends gnome-shell ;;
            kde) sudo apt-get install -y --no-install-recommends kwin-x11 kwin-wayland qtwayland5 plasma-desktop plasma-workspace plasma-workspace-wayland ;;
          esac
          (cd build/candidate-packages/snap && sha256sum --check "licasa_${VERSION}_amd64.snap.sha256")
          sudo snap set system experimental.user-daemons=false
          sudo snap install --dangerous "build/candidate-packages/snap/licasa_${VERSION}_amd64.snap"
          python3 tools/verify_snap_install.py --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --output build/candidate-install.json
      - name: Retry the failed desktop contract with retained evidence
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          TARGET: ubuntu24-snap-${{ matrix.desktop }}
        run: |
          /usr/bin/python3 tools/qualification_evidence.py run-target --source-sha "$SOURCE_SHA" --verification-sha "$GITHUB_SHA" \
            --build-run-id "$BUILD_RUN_ID" --version "$VERSION" \
            --packages build/candidate-packages --evidence build/candidate-reports --target "$TARGET"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retry-outcome-snap-${{ matrix.desktop }}
          path: build/candidate-reports/
          retention-days: 90
          if-no-files-found: error

  attest:
    needs: [plan, packages, snap_desktops]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: verification-*-packages
          path: build/candidate-packages
          merge-multiple: true
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: verification-snap
          path: build/candidate-packages/snap
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: licasa-verification-evidence
          path: build/candidate-evidence
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Retain every passed outcome and replace only the failed targets
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          python3 tools/retry_ci_verification.py prepare-evidence --evidence build/candidate-evidence \
            --targets "$TARGETS" --source-sha "$SOURCE_SHA" --build-run-id "$BUILD_RUN_ID"
      - uses: actions/download-artifact@v8
        with:
          pattern: retry-outcome-*
          path: build/candidate-evidence
          merge-multiple: true
      - name: Recheck every outcome and exact package hash
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          PACKAGE_RESULT: ${{ needs.packages.result }}
          DESKTOP_RESULT: ${{ needs.snap_desktops.result }}
        run: |
          python3 tools/qualification_evidence.py assemble --source-sha "$SOURCE_SHA" --verification-sha "$GITHUB_SHA" \
            --build-run-id "$BUILD_RUN_ID" --version "$VERSION" \
            --packages build/candidate-packages --evidence build/candidate-evidence
          [[ "$PACKAGE_RESULT" = success || "$PACKAGE_RESULT" = skipped ]]
          [[ "$DESKTOP_RESULT" = success || "$DESKTOP_RESULT" = skipped ]]
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: licasa-retry-verification-evidence
          path: build/candidate-evidence/
          retention-days: 90
          if-no-files-found: error
