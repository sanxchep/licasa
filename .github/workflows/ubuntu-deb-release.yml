name: Ubuntu deb package

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing version tag, such as v0.1.1
        type: string
        required: true
      source_ref:
        description: Exact source commit to package
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates cmake ninja-build g++ python3 pkg-config patch git meson nasm dpkg-dev \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-image-formats-plugins \
            libopenjp2-7-dev libjpeg-turbo8-dev \
            qt6-base-private-dev qt6-declarative-private-dev qt6-shadertools-dev \
            qt6-multimedia-dev libpulse-dev libavcodec-dev libavformat-dev \
            libavutil-dev libswresample-dev libswscale-dev libavdevice-dev libavfilter-dev \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qttest qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-dialogs qml6-module-qtquick-layouts
      - name: Build pinned private libraries and deb
        run: python3 tools/build_ubuntu_deb.py --jobs 4
      - name: Install deb on clean Ubuntu and decode samples
        run: python3 tools/verify_deb_container.py build/qualification/deb/licasa_*.deb
      - name: Check package checksum
        run: cd build/qualification/deb && sha256sum --check licasa_*.deb.sha256
      - name: Require the requested package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          shopt -s nullglob
          packages=(build/qualification/deb/licasa_*.deb)
          test "${#packages[@]}" -eq 1
          version="$(dpkg-deb --field "${packages[0]}" Version)"
          test "$version" = "${RELEASE_TAG#v}-1"
      - uses: actions/upload-artifact@v4
        with:
          name: licasa-ubuntu-24.04-amd64
          path: |
            build/qualification/deb/licasa_*.deb
            build/qualification/deb/licasa_*.deb.sha256
            build/qualification/deb/install-smoke.json
          if-no-files-found: error
