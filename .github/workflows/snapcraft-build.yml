name: Verify and release hosted Snap and deb

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: licasa-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check source, new version, beta grade, and notes
        id: version
        run: |
          version="$(python3 tools/check_release_version.py \
            --channel beta \
            --expected-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Require a new GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          status="$(curl --silent --show-error --retry 3 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [ "$status" != 404 ]; then
            echo "Expected no existing GitHub Release; API returned $status" >&2
            exit 1
          fi

  verify_sanitizers:
    needs: [preflight, store_snap]
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ github.sha }}
      presets: '["asan","ubsan"]'

  build_and_test:
    needs: [preflight, verify_sanitizers, store_snap]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates cmake ninja-build g++ python3 pkg-config patch git meson nasm dpkg-dev \
            clang-format-18 \
            binutils qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-image-formats-plugins \
            libopenjp2-7-dev libjpeg-turbo8-dev libxext-dev \
            qt6-base-private-dev qt6-declarative-private-dev qt6-shadertools-dev \
            qt6-multimedia-dev libpulse-dev libavcodec-dev libavformat-dev \
            libavutil-dev libswresample-dev libswscale-dev libavdevice-dev libavfilter-dev \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qttest qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-dialogs qml6-module-qtquick-layouts
      - name: Check first-party C++ formatting
        run: python3 tools/check_code_style.py
      - name: Build once, run Release CTest, and package deb
        run: python3 tools/build_ubuntu_deb.py --jobs 4
      - name: Verify installed Release and hardening
        run: |
          cmake --install build/deb-release --prefix "$RUNNER_TEMP/licasa-package"
          python3 tools/check_hardening.py "$RUNNER_TEMP/licasa-package/bin/licasa"
          python3 tools/verify_installed_release.py "$RUNNER_TEMP/licasa-package" \
            --output build/qualification/deb/release-smoke.json
      - name: Install deb on clean Ubuntu and decode samples
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: python3 tools/verify_deb_container.py "build/qualification/deb/licasa_${VERSION}-1_amd64.deb"
      - name: Save the checked deb and test reports
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cd build/qualification/deb
          sha256sum --check "licasa_${VERSION}-1_amd64.deb.sha256"
          test "$(dpkg-deb --field "licasa_${VERSION}-1_amd64.deb" Version)" = "${VERSION}-1"
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist/deb
          cp "build/qualification/deb/licasa_${VERSION}-1_amd64.deb" dist/deb/
          cp "build/qualification/deb/licasa_${VERSION}-1_amd64.deb.sha256" dist/deb/
          cp build/qualification/deb/install-smoke.json dist/deb/
          cp build/qualification/deb/release-smoke.json dist/deb/
      - uses: actions/upload-artifact@v4
        with:
          name: licasa-deb-amd64
          path: dist/deb/
          if-no-files-found: error

  store_snap:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      revision: ${{ steps.verify.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install the Snapcraft-hosted edge build
        run: |
          sudo snap set system experimental.user-daemons=true
          if ! sudo snap install --channel=edge licasa; then
            echo 'No installable Snapcraft-hosted edge build is ready. Check the snapcraft.io Builds tab, then rerun this release action.' >&2
            exit 1
          fi
      - name: Check hosted source and decode through strict Snap confinement
        id: verify
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 tools/verify_snap_install.py --version "$VERSION" \
            --source-sha "$GITHUB_SHA" \
            --output build/qualification/snap-smoke.json
          revision="$(snap list licasa | awk 'NR == 2 {print $3}')"
          test "$revision" -gt 0
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: licasa-store-snap-smoke
          path: build/qualification/snap-smoke.json
          if-no-files-found: error

  publish_snap:
    needs: [preflight, store_snap, build_and_test]
    runs-on: ubuntu-24.04
    environment: snap-beta
    timeout-minutes: 30
    steps:
      - name: Require Store publishing credentials
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          test -n "$SNAPCRAFT_STORE_CREDENTIALS"
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic
      - name: Promote the verified hosted revision to beta
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          REVISION: ${{ needs.store_snap.outputs.revision }}
        run: snapcraft release licasa "$REVISION" beta

  github_release:
    needs: [preflight, store_snap, publish_snap]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: licasa-deb-amd64
          path: dist/deb
      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gh
      - name: Recheck source version, deb version, and checksum
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 tools/check_release_version.py \
            --channel beta --expected-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF"
          cd dist/deb
          sha256sum --check "licasa_${VERSION}-1_amd64.deb.sha256"
          test "$(dpkg-deb --field "licasa_${VERSION}-1_amd64.deb" Version)" = "${VERSION}-1"
      - name: Publish GitHub Release with the checked deb
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          SNAP_REVISION: ${{ needs.store_snap.outputs.revision }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          {
            cat "packaging/release-notes/$RELEASE_TAG.md"
            printf '\n### Snap Store\n\n'
            printf 'Snapcraft hosted build revision %s (Licasa %s) was installed, tested, and promoted to beta.\n' "$SNAP_REVISION" "$VERSION"
            printf "\n### Debian package SHA-256\n\n\`\`\`text\n"
            cat "dist/deb/licasa_${VERSION}-1_amd64.deb.sha256"
            printf "\`\`\`\n"
            printf "\nSource commit: \`%s\`.\n" "$GITHUB_SHA"
          } > dist/release-notes.md
          gh release create "$RELEASE_TAG" \
            "dist/deb/licasa_${VERSION}-1_amd64.deb" \
            "dist/deb/licasa_${VERSION}-1_amd64.deb.sha256" \
            --target "$GITHUB_SHA" --prerelease --title "Licasa $RELEASE_TAG" \
            --notes-file dist/release-notes.md
