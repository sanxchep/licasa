name: CD · GitHub Releases · Publish Linux packages (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Stage a prerelease or approve its exact files as latest
        type: choice
        options: [stage, promote]
        default: stage
      build_run_id:
        description: Successful staging run ID (promotion only)
        type: string
      expected_sha:
        description: Exact reviewed main commit to qualify and publish as a prerelease
        required: true
        type: string
      approve_prerelease:
        description: Explicitly approve the selected GitHub release operation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: licasa-release
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require explicit publication intent and exact reviewed main source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          APPROVED: ${{ inputs.approve_prerelease }}
        run: |
          test "$APPROVED" = true || {
            echo "::error::Enable approve_prerelease to authorize GitHub release publication."
            exit 1
          }
          test "$GITHUB_REF" = refs/heads/main || {
            echo "::error::Run this workflow from the main branch."
            exit 1
          }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Enter the full 40-character reviewed main commit SHA in expected_sha."
            exit 1
          }
          test "$GITHUB_SHA" = "$EXPECTED_SHA" || {
            echo "::error::The selected main commit differs from expected_sha. Review the selected commit before dispatching again."
            exit 1
          }
      - name: Require the original build run for promotion
        if: inputs.operation == 'promote'
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: '[[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]'
      - name: Check source, new version, stable grade, and notes
        if: inputs.operation == 'stage'
        id: version
        run: |
          version="$(python3 tools/check_release_version.py \
            --channel stable \
            --expected-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Require a new GitHub Release
        if: inputs.operation == 'stage'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          status="$(curl --silent --show-error --retry 3 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [ "$status" != 404 ]; then
            echo "Expected no existing GitHub Release; API returned $status" >&2
            exit 1
          fi
  verify_sanitizers:
    if: inputs.operation == 'stage'
    name: Verify the complete exact candidate
    needs: preflight
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ github.sha }}
      profile: FULL
      offline_packages: true

  stage_candidate:
    needs: [preflight, verify_sanitizers]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: verification-ubuntu-packages
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: verification-debian-packages
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: verification-portable-packages
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: licasa-verification-evidence
          path: build/full-evidence
      - uses: actions/download-artifact@v8
        with:
          name: verification-result
          path: build/full-evidence
      - name: Require FULL gates and the exact already-qualified package bytes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 tools/ci_receipt.py check --offline-packages --receipt build/full-evidence/verification-result.json \
            --source-sha "$SOURCE_SHA" --version "$VERSION"
          python3 tools/qualification_evidence.py check --offline-packages --source-sha "$SOURCE_SHA" \
            --build-run-id "$GITHUB_RUN_ID" --version "$VERSION" --packages dist --evidence build/full-evidence
      - uses: actions/upload-artifact@v7
        with:
          name: licasa-linux-amd64
          path: |
            dist/deb/
            dist/appimage/
            dist/rpm/
            dist/arch/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: licasa-debian13-amd64
          path: dist/debian13/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: licasa-full-verification
          path: build/full-evidence/
          if-no-files-found: error
          retention-days: 90

  github_prerelease:
    needs: [preflight, stage_candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: snap-beta  # Existing protected publication environment
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: licasa-linux-amd64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: licasa-debian13-amd64
          path: dist/debian13
      - name: Recheck package versions and hashes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 tools/check_release_version.py \
            --channel stable --expected-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF"
          (cd dist/debian13 && sha256sum --check "licasa_${VERSION}-1+deb13_amd64.deb.sha256")
          (cd dist/deb && sha256sum --check "licasa_${VERSION}-1_amd64.deb.sha256")
          test "$(dpkg-deb --field "dist/deb/licasa_${VERSION}-1_amd64.deb" Version)" = "${VERSION}-1"
          (cd dist/appimage && sha256sum --check "Licasa-${VERSION}-x86_64.AppImage.sha256")
          (cd dist/appimage && sha256sum --check install-licasa-appimage.sh.sha256)
          (cd dist/rpm && sha256sum --check "licasa-appimage-${VERSION}-1.fc44.x86_64.rpm.sha256")
          (cd dist/arch && sha256sum --check "licasa-appimage-${VERSION}-1-x86_64.pkg.tar.zst.sha256")
          (cd dist/arch && sha256sum --check PKGBUILD.sha256)
          (cd dist/arch && sha256sum --check PKGBUILD.sources.sha256)
      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gh
      - name: Publish checked packages as a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          {
            cat "packaging/release-notes/$RELEASE_TAG.md"
            printf "\n### Package SHA-256 checksums\n\n\`\`\`text\n"
            cat "dist/debian13/licasa_${VERSION}-1+deb13_amd64.deb.sha256"
            cat "dist/deb/licasa_${VERSION}-1_amd64.deb.sha256"
            cat "dist/appimage/Licasa-${VERSION}-x86_64.AppImage.sha256"
            cat "dist/appimage/install-licasa-appimage.sh.sha256"
            cat "dist/rpm/licasa-appimage-${VERSION}-1.fc44.x86_64.rpm.sha256"
            cat "dist/arch/licasa-appimage-${VERSION}-1-x86_64.pkg.tar.zst.sha256"
            cat "dist/arch/PKGBUILD.sha256"
            cat "dist/arch/PKGBUILD.sources.sha256"
            printf "\`\`\`\n"
            printf "\nSource commit: \`%s\`.\n" "$GITHUB_SHA"
          } > dist/release-notes.md
          gh release create "$RELEASE_TAG" \
            "dist/debian13/licasa_${VERSION}-1+deb13_amd64.deb" \
            "dist/debian13/licasa_${VERSION}-1+deb13_amd64.deb.sha256" \
            "dist/deb/licasa_${VERSION}-1_amd64.deb" \
            "dist/deb/licasa_${VERSION}-1_amd64.deb.sha256" \
            "dist/appimage/Licasa-${VERSION}-x86_64.AppImage" \
            "dist/appimage/Licasa-${VERSION}-x86_64.AppImage.sha256" \
            "dist/appimage/install-licasa-appimage.sh" \
            "dist/appimage/install-licasa-appimage.sh.sha256" \
            "dist/rpm/licasa-appimage-${VERSION}-1.fc44.x86_64.rpm" \
            "dist/rpm/licasa-appimage-${VERSION}-1.fc44.x86_64.rpm.sha256" \
            "dist/arch/licasa-appimage-${VERSION}-1-x86_64.pkg.tar.zst" \
            "dist/arch/licasa-appimage-${VERSION}-1-x86_64.pkg.tar.zst.sha256" \
            "dist/arch/PKGBUILD" \
            "dist/arch/PKGBUILD.sha256" \
            "dist/arch/native_lifecycle.py" \
            "dist/arch/licasa.install" \
            "dist/arch/licasa-lifecycle.hook" \
            "dist/arch/PKGBUILD.sources.sha256" \
            --target "$GITHUB_SHA" --title "Licasa $RELEASE_TAG" \
            --prerelease --latest=false --notes-file dist/release-notes.md

  qualify_for_promotion:
    needs: preflight
    if: inputs.operation == 'promote'
    uses: ./.github/workflows/qualify-candidate.yml
    permissions:
      actions: read
      contents: read
    with:
      build_run_id: ${{ inputs.build_run_id }}

  promote:
    needs: qualify_for_promotion
    uses: ./.github/workflows/publish-release.yml
    permissions:
      actions: read
      contents: write
    with:
      build_run_id: ${{ inputs.build_run_id }}
