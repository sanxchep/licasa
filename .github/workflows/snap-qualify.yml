name: Qualify Snap candidate without publishing

# Prepared only. Execution belongs on an ephemeral hosted VM, never the
# owner's working PC. This job has no store credentials or release steps.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Application commit/ref to build and verify
        required: true
        type: string
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: snap-qualify-${{ github.workflow }}-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - name: Require an ephemeral hosted VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Record selected source and check version
        id: source
        run: |
          mkdir -p build/snap-qualification
          git rev-parse HEAD > build/snap-qualification/source-commit.txt
          python3 - "$GITHUB_OUTPUT" <<'PY'
          from pathlib import Path
          import re
          import sys
          cmake = Path('CMakeLists.txt').read_text()
          snap = Path('snap/snapcraft.yaml').read_text()
          versions = re.findall(r'project\(\s*Licasa\s+VERSION\s+(\d+\.\d+\.\d+)\b', cmake)
          snap_versions = re.findall(r"^version:\s*['\"]?(\d+\.\d+\.\d+)['\"]?\s*$", snap, re.M)
          if len(versions) != 1 or snap_versions != versions:
              raise SystemExit('CMake and Snap versions must match')
          with open(sys.argv[1], 'a') as output:
              output.write(f'version={versions[0]}\n')
          PY
      - name: Build the complete standalone Snap source recipe
        id: snapcraft
        run: python3 tools/build_snap_ci.py
      - name: Install archive inspection tools in the hosted VM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools
      - name: Inspect, install and verify the exact candidate
        env:
          SNAP_FILE: ${{ steps.snapcraft.outputs.snap }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          test -f "$SNAP_FILE"
          source_sha="$(cat build/snap-qualification/source-commit.txt)"
          test "$(unsquashfs -cat "$SNAP_FILE" usr/share/licasa/source-commit)" = "$source_sha"
          sudo snap set system experimental.user-daemons=false
          python3 tools/retry_snap_store.py \
            --budget-file "$RUNNER_TEMP/snap-store-retry-budget.json" \
            --report build/snap-store-retries/1.json -- sudo snap install --dangerous "$SNAP_FILE"
          python3 tools/verify_snap_install.py --version "$VERSION" \
            --source-sha "$source_sha" --output build/snap-qualification/install-smoke.json
          cp "$SNAP_FILE" "build/snap-qualification/licasa_${VERSION}_amd64.snap"
          (cd build/snap-qualification && sha256sum "licasa_${VERSION}_amd64.snap" \
            > "licasa_${VERSION}_amd64.snap.sha256")
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: licasa-snap-qualification-${{ github.run_id }}
          retention-days: 7
          compression-level: 0
          path: build/snap-qualification/
      - name: Retain Snap Store retry diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snap-store-retries-snap-qualify-qualify
          path: build/snap-store-retries/
          if-no-files-found: ignore
          retention-days: 7
